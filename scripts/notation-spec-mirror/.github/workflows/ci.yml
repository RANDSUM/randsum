# CI for the notation-spec mirror. This repository is written by
# RANDSUM/randsum's sync workflow from packages/notation-spec, where the same
# checks gate every change; this run proves the mirror stands on its own.
# Require the "check" job in this repository's branch protection.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - run: bun install
      - name: Build, typecheck and test (the reference adapter must reach Level 4)
        run: bun run check
