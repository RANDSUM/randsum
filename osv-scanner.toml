# osv-scanner configuration (audit item X8 / security R2).
#
# Dev/build-time transitive advisories are FORCE-RESOLVED via `overrides` in the
# root package.json wherever a patched release is usable (yaml, esbuild, nanoid,
# sharp, svgo, smol-toml, devalue, @opentelemetry/*, …), so they need no
# suppression here — the scanner sees the patched versions directly. js-yaml is
# the one that cannot be overridden: Bun collapses `overrides` to a single
# version tree-wide, and changesets' read-yaml-file@1 still calls the 3.x
# `safeLoad` while Astro takes 4.x, so bun.lock alone holds 3.15.2 and 4.3.2.
# (The former uuid finding is gone entirely with the expo app removed in #1121.)
#
# Anything suppressed here must be dev/build-time only and reach no published
# package. The published packages are @randsum/roller (zero deps),
# @randsum/games (depends only on @randsum/roller) and @randsum/mcp — the last
# is the only one with real runtime dependencies (@modelcontextprotocol/sdk,
# zod), so its subtree in bun.lock is the one to re-check before adding one.
#
# NOTE ON THE GATES. ci.yml's `dependency-review` is the blocking gate, and it
# sees only the dependencies a PR changes. `bun audit --audit-level=high` scans
# the whole tree in security.yml (every push to main, and weekly) and in
# lefthook pre-push. This OSV job is report-only (`continue-on-error: true`, and
# deliberately NOT in the CI Success `needs` list), so it surfaces medium/low
# findings without breaking the build. A green `bun audit` is a strictly weaker
# statement than a green `sca`: @hono/node-server (Medium) and astro (Medium)
# both sailed past `--audit-level=high` and stopped only here.
#
# KEEPING THE LISTS IN SYNC. `bun audit --ignore` flags belong in TWO places:
#   .github/workflows/security.yml (push to main + weekly cron)
#   lefthook.yml                   (pre-push — local parity)
# Nothing enforces the sync, so mind the direction of drift. An entry here that
# is missing from those two fails the audit loudly, which is the safe way to be
# wrong. The dangerous direction is the reverse: an `--ignore` in `bun audit`
# with no entry here means the audit passes silently while only the report-only
# OSV job still shows the finding. Add here first, then there.
#
# There are no suppressions. The js-yaml (GHSA-5p4m-2wfm-xmqj) and image-size
# (GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr) entries were removed once they
# matched nothing: js-yaml 3.15.2 and 4.3.2 are patched and `astro build` loads
# 4.3.2's ESM exports map, and image-size is no longer in the tree. The earlier
# GHSA-h67p-54hq-rp68 js-yaml entry went the same way.
