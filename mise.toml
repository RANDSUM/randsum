# Node for this repo. Nothing here runs on node in production — every package
# targets bun — but a few dev tools shell out to it: the local publish fallback
# (`bun scripts/publish.ts`) runs `npm publish`, which needs Node >= 22.14.
#
# 24 is the active LTS and matches what CI resolves to: `.github/actions/bun-setup`
# only invokes actions/setup-node when a job passes an explicit version.
[tools]
node = "24"
