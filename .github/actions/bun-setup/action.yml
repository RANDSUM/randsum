name: Setup Bun
description: Read .bun-version, setup bun, restore cache, and install dependencies
inputs:
  node-version:
    description: 'Node version to setup via actions/setup-node (omit to skip node setup)'
    required: false
    default: ''
  registry-url:
    description: 'npm registry URL for setup-node (e.g. https://registry.npmjs.org)'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Read Bun version
      id: bun-version
      shell: bash
      run: echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      with:
        bun-version: ${{ steps.bun-version.outputs.version }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      if: ${{ inputs.node-version != '' }}
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url || '' }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-
    - run: bun install --frozen-lockfile
      shell: bash
