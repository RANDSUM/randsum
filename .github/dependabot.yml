# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # 'bun', not 'npm': the npm updater cannot write bun.lock, so its PRs failed
  # `bun install --frozen-lockfile`, and it now refuses to run at all.
  - package-ecosystem: 'bun'
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    # Supply-chain cooldown: let new releases bake before adopting them (zizmor requires >= 7)
    # (also satisfies zizmor's insufficient-cooldown audit).
    cooldown:
      default-days: 7

  # Keep GitHub Actions up to date. Actions are pinned to commit SHAs, and
  # Dependabot bumps the SHA. It rewrites the trailing version comment only when
  # that comment names the exact version being replaced, so pins carry the full
  # version (`# v6.1.0`, not `# v6`). '/' covers .github/workflows; the second
  # entry covers the composite actions under .github/actions.
  - package-ecosystem: 'github-actions'
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
