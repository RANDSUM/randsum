# Deploy every Cloudflare surface once CI is green on main.
#
# Netlify deployed itself from its own git integration, which is why this repo
# had no deploy job for years. Cloudflare has no equivalent — Workers Builds
# exists, but its monorepo handling has a known flakiness report for workspace
# dependency resolution and nothing authoritative for Bun, and this repo has
# cross-package build ordering (roller -> games -> site) that CI already
# sequences correctly. So deployment lives here, after the build is known-good.
#
# "Known-good" is enforced, not assumed. The trigger is `workflow_run` on CI, as
# publish.yml does it, and nothing deploys unless that CI run concluded
# `success`. Every job checks out the commit CI tested (`workflow_run.head_sha`),
# not whatever main has moved on to since. Under the old `push` trigger the
# deploy ran beside CI, so a red main still shipped the site and the only bot
# host.
#
# SECURITY — workflow_run runs in the privileged base-repo context and holds the
# Cloudflare and Discord secrets. `branches: [main]` matches the triggering
# run's head BRANCH NAME, which a fork PR can also call `main`, so `plan` also
# requires the CI run to come from a push to this repository. Only commits that
# are on main get checked out, and nothing the CI run uploaded is downloaded.
#
# `plan` keeps the economy the old `paths:` filter bought. It diffs the commit
# against the one the last successful CI-triggered run of THIS workflow
# deployed, and deploys only when something a surface ships from changed. As
# before, a relevant change deploys every surface: redeploying an unchanged surface
# is a no-op version upload. Diffing from the last deploy, not the last green CI
# commit, is what makes a cancelled deploy safe: the concurrency group drops a
# pending run when a newer one queues, and the newer run still carries the
# dropped run's changes, slash-command changes included.
#
# Each run records its commit explicitly, in the run name below, and `plan` reads
# it back from `displayTitle`. A run's own `headSha` is not that commit: for a
# workflow_run event it is the default branch's tip when the run was created.
# The base is NOT simply the newest successful run's commit. A run refused for
# being older (below) also concludes success under its older title, so `plan`
# reads the last 50 successful runs and takes the newest commit by ancestry,
# skipping any recorded commit that a later recorded commit descends from. A
# refused run's commit is always an ancestor of the deploy that refused it, so it
# never becomes a base, however many old CI runs are re-run in turn.
# When the commit is a strict ancestor of that base (a CI re-run on an older main
# commit), `plan` deploys nothing rather than ship the older code and command set
# over a newer deploy. Only an unrelated history (or no earlier deploy in that
# window) deploys everything.
#
# Every job FAILS RED when CLOUDFLARE_API_TOKEN is absent. There is no second
# host behind any of these: a skipped site deploy would leave randsum.dev
# serving stale content, and Discord posts interactions to bot.randsum.dev with
# no second transport, so the deployed Worker IS the bot. A missing or renamed
# secret must not read as green.
#
# wrangler is pinned per app through the root `catalog`, so every deploy runs the
# locked version through the app's own `deploy` script, never a floating
# `bunx wrangler@4`.
#
# `workflow_dispatch` is the manual escape hatch, and it exists because a push
# event is not guaranteed to fire. On 2026-09-01 the merge of #1235 produced
# ZERO workflow runs — not this one, not CI, not CodeQL. `actions/runs?head_sha=`
# returned `total_count: 0` twenty minutes later. GitHub dropped the push event,
# and with no CI run there is no `workflow_run` either. A manual run deploys main
# as it stands, without the CI gate, so check main is green before dispatching.
name: Deploy (Cloudflare)
# `plan` parses the deployed commit back out of this title; keep the format.
run-name: Deploy ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  # zizmor: ignore[dangerous-triggers] — workflow_run is used deliberately and
  # safely here per the security note above: push-to-main commits only, and no
  # PR-controlled input or artifacts consumed.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      surface:
        description: 'Which surface to deploy'
        type: choice
        default: all
        options: [all, site, bot]

permissions:
  contents: read

concurrency:
  # Never let two deploys race to the same Worker. Not cancel-in-progress: a
  # half-finished asset upload that gets cancelled is worse than a short queue.
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run list, to find the last deployed commit
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      site: ${{ steps.select.outputs.site }}
      bot: ${{ steps.select.outputs.bot }}
      commands: ${{ steps.select.outputs.commands }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select surfaces
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SURFACE: ${{ inputs.surface }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          # A manual run deploys what it is asked to. A manual bot deploy always
          # rewrites the command registry: that is how drift gets repaired.
          if [ "$EVENT" = workflow_dispatch ]; then
            for s in site bot; do
              if [ "$SURFACE" = all ] || [ "$SURFACE" = "$s" ]; then v=true; else v=false; fi
              echo "$s=$v" >> "$GITHUB_OUTPUT"
            done
            if [ "$SURFACE" = all ] || [ "$SURFACE" = bot ]; then v=true; else v=false; fi
            echo "commands=$v" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The newest commit a successful CI-triggered run of this workflow
          # recorded, parsed from its run name ("Deploy <sha>", set by
          # `run-name` above). The run's own headSha is not that commit: a
          # workflow_run run records the default branch's tip at creation.
          # Diffing from it, rather than from HEAD^ or the previous green CI
          # commit, carries forward every change whose deploy was cancelled or
          # failed. Manual runs are left out: one may have deployed a single
          # surface. A run that deployed nothing because nothing had changed
          # still counts, since nothing a surface ships from had changed up to
          # its commit.
          #
          # "Newest" is by ancestry, not by run order. A run refused below for
          # being older than the last deploy also concludes success, titled with
          # its older commit, so the most recent successful run is not always the
          # last deploy. Walk the last 50, newest run first, and move the base
          # forward only to a commit that descends from it. A refused commit is
          # an ancestor of the deploy that refused it, so it is never chosen. A
          # commit missing from this clone (rewritten history) is skipped. The
          # list is captured first so a failed `gh` call fails the job instead
          # of reading as "no earlier deploy".
          titles=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-cloudflare.yml \
            --branch main --event workflow_run --status success --limit 50 \
            --json displayTitle --jq '.[].displayTitle')
          base=""
          while IFS= read -r title; do
            [[ "$title" =~ ^Deploy\ ([0-9a-f]{40})$ ]] || continue
            candidate="${BASH_REMATCH[1]}"
            git cat-file -e "${candidate}^{commit}" 2>/dev/null || continue
            if [ -z "$base" ]; then
              base="$candidate"
            elif [ "$candidate" != "$base" ] && git merge-base --is-ancestor "$base" "$candidate"; then
              base="$candidate"
            fi
          done <<< "$titles"

          if [ -n "$base" ] && git merge-base --is-ancestor "$base" "$HEAD_SHA" 2>/dev/null; then
            changed=$(git diff --name-only "$base" "$HEAD_SHA")
          elif [ -n "$base" ] && git merge-base --is-ancestor "$HEAD_SHA" "$base" 2>/dev/null; then
            # A CI re-run on a main commit older than the last deploy. Shipping
            # it would roll every surface, and the command registry, back. This
            # run still concludes success under its older title; the ancestry
            # walk above is what keeps that title from becoming the next base.
            echo "::notice::$HEAD_SHA is older than the last deployed commit $base; deploying nothing."
            {
              echo "site=false"
              echo "bot=false"
              echo "commands=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::notice::No earlier successful deploy on this history to diff against; deploying everything."
            changed=ALL
          fi

          deploy=false
          commands=false
          if [ "$changed" = ALL ] || grep -qE '^(apps/(site|discord-bot)/|packages/|bun\.lock$|\.github/workflows/deploy-cloudflare\.yml$)' <<< "$changed"; then
            deploy=true
          fi
          # Only the command sources trigger registration. A command schema that
          # starts deriving from packages/ (choices generated from a game spec,
          # say) would change without matching this; widen it if that happens.
          if [ "$changed" = ALL ] || grep -qE '^apps/discord-bot/src/(commands/|deploy-commands\.ts$)' <<< "$changed"; then
            commands=true
          fi
          {
            echo "site=$deploy"
            echo "bot=$deploy"
            echo "commands=$commands"
          } >> "$GITHUB_OUTPUT"

  site:
    name: randsum.dev
    needs: plan
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/bun-setup

      # The site imports roller through a workspace subpath export; `site...`
      # builds roller first, then the site.
      - name: Build
        run: bun run --filter '@randsum/site...' build

      # The site's `deploy` script ships apps/site/wrangler.jsonc: static assets
      # from dist plus the /api/roll Worker in apps/site/worker, which wrangler
      # bundles itself, like the bot.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set — cannot deploy."
            exit 1
          fi
          bun run --filter @randsum/site deploy

  bot:
    name: bot.randsum.dev
    needs: plan
    if: needs.plan.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/bun-setup

      # The game packages must be built first: the Worker imports them through
      # workspace subpath exports, and wrangler bundles from dist. Unlike the
      # sites there is no separate app build step — wrangler compiles the
      # TypeScript entry itself.
      - name: Build dependencies
        run: bun run --filter '@randsum/discord-bot^...' build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set — cannot deploy."
            exit 1
          fi
          bun run --filter @randsum/discord-bot deploy

      # The Worker reads Discord's command registry and never writes it, so a
      # command change needs this write too. #1191 renamed /su without one and
      # every invocation timed out for a week while the bot was healthy.
      # deploy-commands is one bulk-overwrite PUT of the whole barrel: idempotent,
      # and global because DISCORD_GUILD_ID is not set. It runs after the Worker
      # deploy, so Discord never offers a command the live Worker cannot answer.
      - name: Register slash commands
        if: needs.plan.outputs.commands == 'true'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          # The application id, not a secret: it is in every "Add to Discord" link.
          DISCORD_CLIENT_ID: '1290434147159904276'
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "::error::DISCORD_TOKEN is not set — the Worker deployed, but the command registry was not written."
            exit 1
          fi
          bun run --filter @randsum/discord-bot deploy-commands
