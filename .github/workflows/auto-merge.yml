name: dependabot-auto-merge

# Hands Dependabot's minor and patch bumps to GitHub's auto-merge, which still waits for the
# required check. This is alxjrvs/dotFiles' shared dependabot-auto-merge.yml with one change: it
# enables auto-merge with a GitHub App token instead of github.token. A merge made by
# GITHUB_TOKEN starts no workflows, so CI and then Release never ran on main after a Dependabot
# merge (audit rel-token-starvation). The shared workflow has no way to take a token, so this
# repo carries its own copy until it does.
#
# `pull_request`, never `pull_request_target`: the job never checks out the PR. A run triggered
# by Dependabot reads Dependabot secrets, not Actions secrets, so BOT_APP_CLIENT_ID and
# BOT_APP_PRIVATE_KEY must exist in both stores.
on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
      # An allowlist, so an update type it cannot classify stays a manual PR.
      - if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - if: steps.app-token.outcome == 'success'
        # The title alone: a Dependabot body is release notes.
        run: gh pr merge --auto --squash --body "" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
