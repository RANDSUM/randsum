name: Security Audit
permissions:
  contents: read
# The whole-tree advisory scan. It gates nothing: PRs are gated by ci.yml's
# `dependency-review`, which reviews only what a PR changes. This run reports
# the tree main actually holds — on every push, and weekly to catch advisories
# newly published against unchanged code.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/bun-setup

      # A suppression (`--ignore=GHSA-…`) is justified in osv-scanner.toml
      # first, then mirrored here and in lefthook.yml's pre-push audit.
      - name: Security audit
        run: bun audit --audit-level=high
