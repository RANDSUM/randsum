name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      roller: ${{ steps.filter.outputs.roller }}
      games: ${{ steps.filter.outputs.games }}
      mcp: ${{ steps.filter.outputs.mcp }}
      site: ${{ steps.filter.outputs.site }}
      skill: ${{ steps.filter.outputs.skill }}
      discord-bot: ${{ steps.filter.outputs.discord-bot }}
      changesets: ${{ steps.filter.outputs.changesets }}
      # Dynamic matrix for the consolidated `package` job below: one include leg
      # per CHANGED package, carrying its per-package config (node version,
      # coverage flag, size gate). Job-level `if` cannot see `matrix`, so
      # filtering the legs here is how unchanged packages skip.
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Root config every package builds or installs against. A PR
            # touching only these (a catalog or lockfile bump) fans out to every
            # package leg instead of producing an empty matrix.
            shared:
              - 'bun.lock'
              - 'package.json'
              - 'tsconfig*.json'
              - 'bunfig.toml'
              - '.github/actions/**'
            roller:
              - 'packages/roller/**'
              # Roller tests also guard published docs: the site's modifier
              # application-order table and the Level 4 conformance claim check.
              - 'apps/site/src/content/docs/**'
              - 'README.md'
              - 'llms.txt'
              - 'apps/*/README.md'
              - 'packages/*/README.md'
              - '.github/workflows/ci.yml'
            games:
              - 'packages/roller/**'
              - 'packages/games/**'
              - '.github/workflows/ci.yml'
            mcp:
              - 'packages/roller/**'
              - 'packages/games/**'
              - 'packages/mcp/**'
              - '.github/workflows/ci.yml'
            site:
              - 'packages/**'
              - 'apps/site/**'
              # The site build prepends the repo-root llms.txt to dist/llms.txt.
              - 'llms.txt'
              - 'plugins/**'
              - '.github/workflows/ci.yml'
            skill:
              - 'plugins/**'
              - '.claude-plugin/**'
              - '.github/workflows/ci.yml'
            discord-bot:
              - 'apps/discord-bot/**'
              - 'packages/roller/**'
              - 'packages/games/**'
              - '.github/workflows/ci.yml'
            changesets:
              - '.changeset/**'
              - '!.changeset/README.md'
              - '!.changeset/config.json'
              # Also re-run the publish dry-run when the packaging surface changes,
              # so publint/attw catch manifest regressions without a changeset.
              - 'scripts/publish.ts'
              - 'packages/*/package.json'
      - name: Build package matrix
        id: set-matrix
        # Emit one include leg per CHANGED package. The full per-package config
        # lives here; jq keeps only the legs whose paths-filter output is 'true',
        # or every leg when the shared root config changed.
        # An empty include => the `package` job produces zero legs and is skipped.
        run: |
          all='[
            {"pkg":"roller","coverage":"roller","size":true},
            {"pkg":"games","coverage":"games","size":true},
            {"pkg":"mcp"},
            {"pkg":"discord-bot"},
            {"pkg":"site","node":"22"}
          ]'
          changed='${{ toJSON(steps.filter.outputs) }}'
          include=$(jq -cn --argjson all "$all" --argjson changed "$changed" \
            '$all | map(select($changed[.pkg] == "true" or $changed.shared == "true"))')
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  # The per-package jobs (roller, games, mcp, discord-bot, site) were
  # near-identical, differing only in filter name, node version, and coverage
  # flags. They are folded into one matrix, populated dynamically by the
  # `changes` job so only changed packages get a leg. The `include` entries
  # carry the per-package differences.
  package:
    name: ${{ matrix.pkg }}
    needs: changes
    # Skip entirely when no package changed (empty include => no legs anyway,
    # but this keeps the job from appearing at all).
    if: fromJSON(needs.changes.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    strategy:
      # Run every package leg even if a sibling fails, so the CI Success gate
      # sees each package's real result instead of a fail-fast cancellation.
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
        with:
          # site pins node 22 so CI builds it on a fixed runtime rather
          # than drifting with the runner default; other legs pass '',
          # which bun-setup treats as "skip node setup".
          node-version: ${{ matrix.node || '' }}
      - name: Build dependencies
        # `^...` selects the package's workspace dependencies (devDependencies
        # included) but not the package itself, and bun runs them in dependency
        # order. roller has none, so bun warns and builds nothing.
        env:
          PKG: ${{ matrix.pkg }}
        run: bun run --filter "@randsum/$PKG^..." --if-present build
      - name: Verify generated files are up to date
        if: matrix.pkg == 'games'
        run: bun run --filter '@randsum/games' gen:check
      - name: Check
        # The coverage packages' `test` scripts write coverage/lcov.info, so the
        # suite runs once here and the upload below reads its output.
        env:
          PKG: ${{ matrix.pkg }}
        run: bun run --filter "@randsum/$PKG" check
      - name: Upload coverage to Codecov
        if: matrix.coverage && hashFiles(format('packages/{0}/coverage/lcov.info', matrix.pkg)) != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./packages/${{ matrix.pkg }}/coverage/lcov.info
          flags: ${{ matrix.coverage }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Check bundle size
        if: matrix.size
        env:
          PKG: ${{ matrix.pkg }}
        run: bun run --filter "@randsum/$PKG" size

  repo:
    # Repo-wide gates that each finish in about a second, folded into one job so
    # they share one checkout and one dependency install. Every step after setup
    # runs even if an earlier one failed, so one push reports every red gate.
    #
    # - workspace-scripts: a package silently dropping a standard script.
    #   `bun run --filter '*' <script>` skips packages that lack it.
    # - ci-aggregator: a job missing from `ci-gate`'s hand-maintained `needs:`
    #   still runs and goes red, but cannot fail the only required check.
    # - biome: one `biome ci .` lints and format-checks every package plus
    #   scripts/, biome-plugins/ and root configs, emitting file/line
    #   annotations. No package can opt out of it by omitting a script.
    #   Its noImportCycles and noRestrictedImports rules hold the import
    #   cycle and src/dist reach-in invariants.
    # - typecheck:scripts: scripts/ (publish.ts and these guards) is not a
    #   workspace, so no package's typecheck reaches it.
    # - knip: unused files, exports and dependencies.
    name: repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/bun-setup
      - name: workspace-scripts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check:workspace-scripts
      - name: ci-aggregator
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check:ci-aggregator
      - name: biome
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bunx biome ci .
      - name: typecheck scripts/
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run typecheck:scripts
      - name: knip
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run knip

  skill:
    name: claude-doctor
    needs: changes
    if: needs.changes.outputs.skill == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - name: Verify skills
        run: for f in plugins/randsum/skills/*/SKILL.md; do npx skills-ref validate "$f"; done
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Verify plugin
        run: claude plugin validate plugins/randsum
      - name: Verify marketplace
        run: claude plugin validate .claude-plugin/marketplace.json

  publish-dry-run:
    name: publish (dry run)
    needs: changes
    if: needs.changes.outputs.changesets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - name: Require an @randsum/mcp bump alongside roller or games
        # mcp bundles roller and games (noExternal in its bunup config) but lists
        # them only as devDependencies, and changesets never bumps a dependent
        # for a devDependency. Without this, a roller or games release ships
        # while the published mcp keeps the old copy bundled inside it. The rule
        # lives in scripts/check-changesets.ts so the root `check` chain runs it too.
        run: bun run check:changesets
      - run: bun run build
      - name: Dry-run publish
        # --pack-dir keeps the tarballs publish.ts packed, so the lint step below
        # checks the exact files that would ship (roller's included, with its
        # pack-time sideEffects flip) instead of packing a second time.
        run: bun scripts/publish.ts --dry-run --pack-dir="$RUNNER_TEMP/tarballs"
      - name: Lint packaged tarballs (publint + attw)
        # Validate each tarball's manifest and type-resolution profile. Pinned via
        # bunx so no root deps are added. These are ESM-only packages, so attw runs
        # with --profile esm-only to not fail on the expected missing-CJS resolutions.
        run: |
          set -euo pipefail
          for tgz in "$RUNNER_TEMP"/tarballs/*.tgz; do
            echo "::group::$(basename "$tgz")"
            bunx publint@0.3.21 "$tgz"
            bunx @arethetypeswrong/cli@0.18.4 --profile esm-only "$tgz"
            echo "::endgroup::"
          done

  dependency-review:
    # The blocking advisory gate, scoped to the dependencies this PR changes: an
    # advisory published against code already on main cannot block an unrelated
    # PR, nor the PR that fixes it. The whole-tree `bun audit` runs in
    # security.yml (weekly and on every push to main);
    # `high` matches its threshold, and both scopes match its reach (the action
    # blocks on runtime only by default, so a devDependency would slip past).
    # GitHub's dependency graph reads this repo's package.json manifests, not
    # bun.lock, so this sees direct dependencies; transitives are the whole-tree
    # audit's job.
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

  sca:
    # SCA + license surfacing (audit X8a / security R2, F1, F2). Suppresses the
    # known dev/build-time advisories via osv-scanner.toml and surfaces LGPL/MPL
    # transitives. Report-only: `dependency-review` above is the blocking
    # advisory gate, while this job deliberately reports what that gate does not
    # cover — the whole tree, below `high`. `continue-on-error: true` plus its
    # absence from the `CI Success` needs list is what keeps those findings
    # informative rather than blocking. See osv-scanner.toml for the per-advisory reasoning.
    name: sca
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vulnerability scan (OSV). License surfacing was dropped — osv-scanner
      # v2's `--licenses` flag is an SPDX allowlist checker, not a summary mode
      # (`--licenses=summary` errors), and an allowlist would fail on the known
      # LGPL/MPL build-tool transitives. Revisit if a summary subcommand lands.
      - name: OSV vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --recursive
            ./

  ci-gate:
    name: CI Success
    if: always()
    # `package` is the consolidated matrix job: its single `result` aggregates
    # every leg (roller, games, mcp, discord-bot, site) — if
    # any leg fails, the aggregate is `failure`, so listing it once still covers
    # all five packages. `repo` runs the repo-wide gates, including the
    # `ci-aggregator` step that guards this very list.
    #
    # `changes` is listed even though nothing here reads its outputs: a failure in
    # it leaves its four dependents `skipped` rather than `failure`, and the loop
    # below treats skipped as a pass — so without it, a broken matrix build was a
    # green gate. (Found by `ci-aggregator` on its first run.)
    needs:
      - changes
      - package
      - repo
      - skill
      - publish-dry-run
      - dependency-review
    runs-on: ubuntu-latest
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      # Name each failed job in the log, as an annotation and in the step
      # summary, so whoever reads this one required check (often an agent on
      # `gh pr checks --required`) sees which job broke without opening the
      # other nine.
      - name: Check results
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          {
            echo '| Job | Result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key) \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            while read -r job result; do
              echo "::error title=CI Success::$job $result"
            done <<< "$failed"
            exit 1
          fi
          echo "All checks passed (or were skipped)"
