name: Workflow Lint

# Static analysis of the GitHub Actions workflows themselves (audit CI-tooling).
# Not a required check / not wired into the CI Success gate — it's an advisory
# hardening pass. actionlint validates workflow syntax + shellcheck's the `run:`
# scripts; zizmor audits for CI security smells. Both actions are SHA-pinned like
# every other action in this repo. `lefthook validate` checks lefthook.yml against
# its schema: an invalid key there is silently ignored, not rejected.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'lefthook.yml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'lefthook.yml'

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e  # v0.7.1
        with:
          version: 1.20.0
          # All remaining findings are Low-confidence `artipacked` noise — these
          # checkouts never reuse the persisted credential. The two higher-confidence
          # findings (dangerous-triggers, bot-conditions) are documented + inline
          # `# zizmor: ignore`d at their sites.
          min-confidence: medium
          # Offline audits only: deterministic, no dependence on the GHSA feed.
          online-audits: false
          # Emit inline annotations instead of uploading SARIF — the repo uses
          # GitHub default-setup code scanning, so an advanced-security upload here
          # would collide with it.
          advanced-security: false
          annotations: true

  lefthook:
    name: lefthook validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/bun-setup
      - run: bunx lefthook validate
