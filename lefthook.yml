# Top-level `output` is the only place lefthook reads it (nested under a hook it
# fails `lefthook validate` and is ignored). `summary` + `failure` hides a
# passing step's output and prints a failing step's in full, so no step needs a
# `> /dev/null` redirect. Each step's `fail_text` is its remedy, printed on the
# summary line when it fails.
output:
  - summary
  - failure

pre-commit:
  # `install` runs alone first; if it fails nothing else runs against a stale
  # node_modules. The checks then run in parallel. (Under `parallel: true`
  # lefthook ignores `priority`, so install used to race lint/typecheck on
  # fresh checkouts and flake workspace resolution.)
  piped: true
  jobs:
    - name: install
      run: bun install --frozen-lockfile
      fail_text: bun.lock is out of date. Run `bun install` and stage bun.lock
    - name: checks
      group:
        parallel: true
        jobs:
          # Biome replaces the former ESLint (--fix) + Prettier steps in a single
          # pass: `check --write` runs the linter (applying safe fixes) and the
          # formatter. Unfixable lint errors still exit non-zero and block the
          # commit. Biome is the sole formatter, including for .astro files (it
          # formats and lints the frontmatter script; the template markup is left
          # as-authored, the deliberate single-formatter trade-off).
          - name: biome
            glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css,astro}"
            run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
            stage_fixed: true
            fail_text: Biome could not auto-fix the errors above. Fix them by hand, then re-stage
          - name: typecheck
            run: bun run typecheck
            fail_text: Fix the type errors above (`bun run typecheck`). TS2307 on @randsum/* means dist is missing; run `bun run build`
          - name: codegen-check
            glob: "packages/games/*.randsum.json"
            run: bun run --filter @randsum/games gen:check
            fail_text: Run `bun run --filter @randsum/games gen`, then stage packages/games/src/*.generated.ts

pre-push:
  # `build` runs alone first; if it fails nothing else runs against a stale
  # dist. The checks then run in parallel.
  piped: true
  jobs:
    - name: build
      run: bun run build
      fail_text: Fix the build errors above (`bun run build`)
    - name: checks
      group:
        parallel: true
        jobs:
          - name: codegen-check
            run: bun run --filter @randsum/games gen:check
            fail_text: Run `bun run --filter @randsum/games gen`, then commit packages/games/src/*.generated.ts
          - name: conformance-check
            run: bun run --filter @randsum/rdn conformance:check
            fail_text: The check regenerated the file; commit apps/rdn/public/conformance/v0.9.0.json
          - name: test
            run: bun run test
            fail_text: Fix the failing tests above (`bun run test`)
          - name: knip
            run: bun run knip
            fail_text: Remove the unused files, exports or dependencies knip lists above (`bun run knip`)
