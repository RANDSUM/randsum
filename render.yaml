services:
  - type: worker
    name: randsum-discord-bot
    runtime: node
    # Explicit region/plan/autoDeploy/numInstances so cost + latency posture is
    # captured in code rather than left to Render's silent defaults (audit L5 /
    # infrastructure F4). numInstances MUST stay 1: a Discord gateway worker
    # must hold a single connection — multiple instances double-process events.
    region: oregon
    plan: starter
    autoDeploy: true
    numInstances: 1
    # Scope the build to the bot's dependency subtree (roller -> games -> bot)
    # instead of the full-monorepo `bun run build`, which also built the CLI.
    buildCommand: bun install --frozen-lockfile && bun run --filter @randsum/roller --filter @randsum/games --filter @randsum/discord-bot build
    startCommand: node --enable-source-maps apps/discord-bot/dist/index.js
    envVars:
      # Pin Bun to match .bun-version (1.4.0) so the Render build uses the same
      # toolchain as CI/lefthook (audit X4). The live service was on 1.3.8 —
      # if this blueprint is not auto-synced, update the dashboard env var too.
      - key: BUN_VERSION
        value: 1.4.0
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      # Sentry DSN for error tracking (read by src/utils/errorTracker.ts).
      # Optional at runtime — the tracker no-ops when unset.
      - key: SENTRY_DSN
        sync: false
      # Discord webhook that captured exceptions are posted to. The cheapest
      # alerting path and the one that needs no third-party account; repeated
      # identical errors are suppressed for 10 minutes so a crash loop cannot
      # flood the channel. Runs alongside SENTRY_DSN rather than instead of it.
      - key: DISCORD_ERROR_WEBHOOK_URL
        sync: false
      # Dead-man's-switch URL, pinged every 60s. The only signal that survives
      # the process dying — on 2026-08-18 the bot was offline for an hour with
      # every Render signal green, because a healthy-but-disconnected process
      # looks identical to a healthy one from the outside.
      - key: HEALTHCHECK_URL
        sync: false
