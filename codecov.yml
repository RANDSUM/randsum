coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 5%
    patch:
      default:
        target: 70%
        threshold: 5%

# Per-package flags so each library's coverage is tracked independently and
# carried forward when its files are untouched in a PR.
flags:
  roller:
    paths:
      - packages/roller/
    carryforward: true
  games:
    paths:
      - packages/games/
    carryforward: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
